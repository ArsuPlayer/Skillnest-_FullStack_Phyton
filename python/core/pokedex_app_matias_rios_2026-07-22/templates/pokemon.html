<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} - Pokédex</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    <div class="container my-4">
        <!-- Cabecera -->
        <div class="text-center mb-4">
            <h1 class="text-primary fw-bold">🔴 Pokédex</h1>
            <p class="text-muted fs-5">{{ titulo }}</p>
            
            <!-- Botones de navegación requeridos por el diseño -->
            <div class="mt-3">
                <a href="/pokemon" class="btn btn-primary btn-sm me-2">📋 Ver todos</a>
                <a href="/pokemon/cantidad/5" class="btn btn-success btn-sm">⚡ Ver 5 primeros</a>
            </div>
        </div>

        <!-- Tarjetas de Pokémon -->
        <div class="row row-cols-1 row-cols-md-3 g-4">
            {% for pokemon in lista_pokemon %}
            <div class="col">
                <div class="card h-100 shadow-sm border-0 position-relative">
                    <span class="position-absolute top-0 end-0 badge bg-dark m-2">#{{ pokemon.id }}</span>
                    
                    <div class="text-center p-3 bg-white rounded-top">
                        <img src="{{ url_for('static', filename='images/' + pokemon.imagen) }}" 
                             alt="{{ pokemon.nombre }}" 
                             class="img-fluid pokemon-img" style="height: 140px; object-fit: contain;">
                    </div>
                    
                    <div class="card-body text-center">
                        <h4 class="card-title fw-bold text-dark">{{ pokemon.nombre }}</h4>
                        <p class="mb-2"><span class="badge bg-success text-white">{{ pokemon.tipo }}</span></p>
                        
                        <div class="text-start mt-3 px-3">
                            <p class="mb-1 small text-muted">⚡ Poder: {{ pokemon.poder }}</p>
                            <div class="progress mb-2" style="height: 6px;">
                                <div class="progress-bar bg-primary" role="progressbar" style="width: {{ pokemon.poder }}%;"></div>
                            </div>
                            <div class="d-flex justify-content-between small text-muted">
                                <span><i class="bi bi-rulers"></i> Altura: {{ pokemon.altura }}</span>
                                <span><i class="bi bi-weight"></i> Peso: {{ pokemon.peso }}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card-footer bg-white border-0 text-center pb-3">
                        <a href="/pokemon/{{ pokemon.nombre | lower }}" class="btn btn-outline-primary btn-sm w-75">Ver detalles</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
