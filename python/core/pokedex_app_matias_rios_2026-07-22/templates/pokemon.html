<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} - Pokédex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    <div class="container my-4">
        <div class="text-center mb-4">
            <h1 class="text-primary fw-bold">🔴 Pokédex</h1>
            <p class="text-muted fs-6 mb-3">{{ titulo }}</p>
            
            <div class="d-flex justify-content-center gap-2">
                <a href="/pokemon" class="btn btn-primary btn-sm px-3 shadow-sm">
                    <i class="bi bi-list-ul"></i> Ver todos
                </a>
                <a href="/pokemon/cantidad/5" class="btn btn-success btn-sm px-3 shadow-sm">
                    <i class="bi bi-lightning-fill"></i> Ver 5 primeros
                </a>
            </div>
        </div>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            {% for pokemon in lista_pokemon %}
            <div class="col">
                <div class="card h-100 shadow-sm border-0 position-relative pokemon-card">
                    <span class="position-absolute top-0 end-0 badge bg-dark m-2 rounded-pill px-2 py-1 shadow-sm">
                        #{{ pokemon.id }}
                    </span>
                    
                    <div class="text-center p-4 pokemon-img-container">
                        <img src="{{ url_for('static', filename='images/' + pokemon.imagen) }}" 
                             alt="{{ pokemon.nombre }}" 
                             class="img-fluid pokemon-img">
                    </div>
                    
                    <div class="card-body text-center d-flex flex-column justify-content-between p-3">
                        <div>
                            <h4 class="card-title fw-bold text-dark mb-2">{{ pokemon.nombre }}</h4>
                            
                            <!-- Renderizado limpio de los tipos -->
                            <p class="mb-3 d-flex justify-content-center gap-1">
                                {% for t in pokemon.tipos %}
                                    <span class="badge px-3 py-1 rounded-pill badge-{{ t | lower | replace('é', 'e') }}">
                                        {{ t }}
                                    </span>
                                {% endfor %}
                            </p>
                            
                            <div class="text-start px-2 mt-2">
                                <div class="d-flex justify-content-between small text-muted mb-1">
                                    <span><i class="bi bi-lightning-fill text-warning"></i> Poder</span>
                                    <span class="fw-bold text-dark">{{ pokemon.poder }}</span>
                                </div>
                                <div class="progress mb-3" style="height: 6px;">
                                    <div class="progress-bar bg-primary rounded-pill" role="progressbar" 
                                         style="width: {{ (pokemon.poder / 200) * 100 }}%;">
                                    </div>
                                </div>
                                <div class="d-flex justify-content-between small text-muted border-top pt-2">
                                    <span><i class="bi bi-rulers"></i> Altura: <strong>{{ pokemon.altura }}</strong></span>
                                    <span><i class="bi bi-weight"></i> Peso: <strong>{{ pokemon.peso }}</strong></span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card-footer bg-white border-0 text-center pb-3 pt-0">
                        <a href="/pokemon/{{ pokemon.nombre | lower }}" class="btn btn-outline-primary btn-sm w-80 rounded-pill px-4">
                            Ver detalles
                        </a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
