<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario</title>
    <link rel="stylesheet" href="css/pagina.css">
</head>

<body>
    <div class="form-container">
        <h2 class="form-title">Nuevo Usuario</h2>

        <form class="user-form">
            <div class="form-group">
                <label for="new-name">Nombre</label>
                <input type="text" id="new-name" name="name">
            </div>

            <div class="form-group">
                <label for="new-email">E-mail</label>
                <input type="email" id="new-email" name="email">
            </div>

            <div class="form-group">
                <label for="new-password">Contraseña</label>
                <input type="password" id="new-password" name="password">
            </div>

            <div class="form-group">
                <label for="new-confirm">Conf. Contraseña</label>
                <input type="password" id="new-confirm" name="confirm-password">
            </div>

            <div class="form-group">
                <label for="user-type">Tipo de Usuario</label>
                <div class="select-wrapper">
                    <select id="user-type" name="user-type">
                        <option value="admin">Administrador</option>
                        <option value="user">Usuario</option>
                    </select>
                </div>
            </div>

            <div class="button-container">
                <button type="submit" class="btn-create">Crear</button>
            </div>
        </form>
    </div>
</body>

</html>
