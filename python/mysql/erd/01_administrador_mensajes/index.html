<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión y Registro</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

    <div class="container">
        
        <div class="form-section login-section">
            <h2 class="form-title">Inicio de Sesión</h2>
            <form class="form-grid">
                <label for="login-email">E-mail</label>
                <input type="email" id="login-email" name="email">
                
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" name="password">
                
                <div class="button-wrapper login-btn-wrapper">
                    <button type="submit" class="btn">Iniciar Sesión</button>
                </div>
            </form>
        </div>

        <div class="form-section register-section">
            <h2 class="form-title">Registro</h2>
            <form class="form-grid">
                <label for="reg-name">Nombre</label>
                <input type="text" id="reg-name" name="name">
                
                <label for="reg-email">E-mail</label>
                <input type="email" id="reg-email" name="email">
                
                <label for="reg-password">Contraseña</label>
                <input type="password" id="reg-password" name="password">
                
                <label for="reg-confirm">Conf. Contraseña</label>
                <input type="password" id="reg-confirm" name="confirm-password">
                
                <div class="button-wrapper register-btn-wrapper">
                    <button type="submit" class="btn">Registrar</button>
                </div>
            </form>
        </div>

    </div>

</body>
</html>
